<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Créer votre PIN</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="pin-setup-container">
    <div class="pin-icon">
      <ion-icon name="lock-closed-outline"></ion-icon>
    </div>

    <h2>Sécurisez votre compte</h2>
    <p class="subtitle">Définissez un code PIN à 4 chiffres pour protéger vos transactions</p>

    <div class="pin-digits">
      <input type="text" maxlength="1" [(ngModel)]="pinDigits[0]" (input)="moveFocus($event, 1)" placeholder="•" />
      <input type="text" maxlength="1" [(ngModel)]="pinDigits[1]" (input)="moveFocus($event, 2)" placeholder="•" />
      <input type="text" maxlength="1" [(ngModel)]="pinDigits[2]" (input)="moveFocus($event, 3)" placeholder="•" />
      <input type="text" maxlength="1" [(ngModel)]="pinDigits[3]" (input)="moveFocus($event, -1)" placeholder="•" />
    </div>

    <div class="pin-confirm" *ngIf="pinDigits.join('').length === 4">
      <label>Confirmer le PIN</label>
      <div class="input-wrapper">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <input type="password" maxlength="4" [(ngModel)]="pinConfirm" placeholder="••••" />
      </div>
    </div>

    <p class="error" *ngIf="pinError">{{ pinError }}</p>

    <ion-button expand="block" size="large" class="confirm-btn" [disabled]="pinDigits.join('').length !== 4 || !pinConfirm || loading" (click)="confirmPinSetup()">
      <ion-icon name="checkmark-circle-outline" slot="start" *ngIf="!loading"></ion-icon>
      <ion-spinner slot="start" *ngIf="loading"></ion-spinner>
      {{ loading ? 'Enregistrement...' : 'Valider et continuer' }}
    </ion-button>

    <p class="info">Ce code sera demandé à chaque ouverture de l'application</p>
  </div>
</ion-content>
